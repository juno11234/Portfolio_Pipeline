          - type: image
            src: ../../assets/MouseAndCheese/블렌더 관련이미지/애니메이션.png
            label: ANIMATION
            caption: >-
              쥐 캐릭터 애니메이션 — 포즈 모드에서 컨트롤 본을 움직여 25프레임 구간을 키프레임으로 잡았습니다.

# ── ④ 고민과 선택 ─────────────────────────────────────────────────────────
decisions:
  - title: 렌더링 최적화 대상 — 드로우콜 vs 그림자 캐스터
    options:
      - { key: A, title: 드로우콜(316) 줄이기 }
      - { key: B, title: 그림자 캐스터(142) 줄이기, chosen: true }
    criteria:
      - label: 측정값
        values:
          - Draw Calls 316 · SetPass Calls 39
          - Shadow Casters 142
      - label: 성능 영향 판단
        values:
          - SetPass 가 낮아(SRP Batcher 가 같은 셰이더를 묶음) 지장 없다고 봄
          - 움직이지 않는 정적 오브젝트까지 매 프레임 실시간 그림자맵에 그려짐
      - label: 해결 수단
        values:
          - 메시 · 머티리얼 합치기, 배칭
          - Mixed Light · Shadowmask 로 정적 오브젝트 그림자 베이크
    reason: >-
      드로우콜 숫자는 높아 보였지만 비용이 큰 SetPass Call 이 39 로 낮아 성능에 지장이 없다고 판단했습니다. 반면 그림자 캐스터
      142 개는 대부분 움직이지 않는 주방 오브젝트였습니다. ==정적 오브젝트 그림자를 굽기==로 했고, 베이크 후 !!그림자가 전부
      사라지는!! 문제를 셰이더 수정으로 풀었습니다. 결과 Shadow Casters ==142 → 15==.

  - title: 임포트 회전 보정 — Bake Space Transform 일괄 OFF vs 단일 모델만 ON
    options:
      - { key: A, title: 모든 모델 OFF }
      - { key: B, title: 계층 없는 단일 모델만 ON, chosen: true }
    criteria:
      - label: 계층 모델(냉장고)
        values:
          - 빈 루트가 회전을 흡수해 정상
          - OFF 유지 → 정상
      - label: 단일 모델
        values:
          - 자신이 루트라 회전 보정 문제
          - 회전을 0 으로 보정
      - label: 자식 Transform 변경 문제
        values:
          - 없음
          - 자식이 없는 모델에만 켜므로 해당 없음
      - label: 설정 관리
        values:
          - 규칙 하나
          - 모델 구조에 따라 설정을 구분해야 함
    reason: >-
      계층 구조가 있는 모델은 회전값 0 인 빈 루트가 자동으로 생겨 회전을 흡수하지만, 계층이 없는 단일 모델은 오브젝트 자신이
      루트가 되어 !!회전 보정이 깨졌습니다.!! 이전에 냉장고에서 이 옵션을 켰다가 자식 Transform 이 바뀌어 꺼 두었는데, 단일
      모델은 자식이 없어 그 문제를 겪을 일이 없고 오히려 회전을 0 으로 맞추는 데 필요했습니다. 그래서 ==자식 없는 단일 모델에만
      켰습니다.==

  - title: 음식 · 장애물 판별 — 태그 vs 인터페이스
    options:
      - { key: A, title: 태그 기반 분기 }
      - { key: B, title: IHungerObj 인터페이스, chosen: true }
    criteria:
      - label: 새 종류 추가
        values:
          - 종류마다 태그를 새로 추가해야 함
          - 태그 추가 없이 인터페이스 구현 컴포넌트만 부착
      - label: 코드 중복
        values:
          - 태그별 분기에 비슷한 처리가 반복됨
          - 하나의 경로로 통합 — 중복 제거
      - label: 값 전달
        values:
          - 종류별로 분기해 값을 정함
          - 오브젝트가 든 변경량을 인자로 넘김
    reason: >-
      태그 방식은 종류가 늘 때마다 태그를 추가해야 했고, 분기마다 비슷한 코드가 반복됐습니다. ==인터페이스로 바꾸고 값을 인자로
      넘기니== 태그를 추가할 필요가 없어졌고 중복 코드도 사라졌습니다. 지금은 시간 감소 · 음식 · 쥐덫이 모두 배고픔을 바꾸는
      한 경로를 타고, 배고픔이 바뀌면 이벤트로 UI · 연출 쪽에 알립니다.

# ── ⑤ 결과 · 회고 (② 사람이 쓴 판단) ──────────────────────────────────────
retrospective:
  results:
    - Shadow Casters **142 → 15** (정적 그림자 베이크 + 소품 그림자 캐스팅 끄기)
    - Draw Calls 316 → 173
  satisfaction:
    - title: 툰 셰이더
      body: 툰 셰이더와 속도 라디얼 블러가 만족스럽게 나왔습니다.
    - title: 게임 개발 파이프라인 경험
      body: 기획부터 모델링, 프로그래밍까지 게임 개발 파이프라인 전체를 경험했습니다.
  learnings:
    - title: 블렌더 임포트
      cells:
        - label: 스케일 100
          body: >-
            블렌더에서 가져온 모델의 스케일이 !!100 으로 읽혔습니다.!! Apply Scalings 를 **All Local**, 유니티 쪽을 **FBX Units
            Scale** 로 맞춰 해결했습니다 — 파일에 적힌 값을 그대로 읽을지, 유니티가 변환해 1 로 읽을지의 차이였습니다.
        - label: 회전
          body: >-
            계층 없는 단일 모델만 회전 보정이 깨졌습니다. 빈 루트가 회전을 흡수하는지가 갈랐고, 단일 모델에만 Bake Space
            Transform 을 켰습니다(고민과 선택 2).
        - label: 알게 된 점
          body: >-
            Export · Import 설정은 한 번 틀리면 모델마다 반복됩니다. ==설정을 프리셋으로 만들어== 같은 실수를 되풀이하지 않게 했습니다.
    - title: 툰 셰이더
      tint: true
      body: >-
        셰이더에서 Pass 를 선언하고 Pass 별로 HLSL 을 작성하는 방식, 메인 라이팅 · 그림자 · 포스트프로세스, 그리는 순서를 정할 때
        쓰는 깊이 버퍼까지 — 셰이더 구조를 더 깊이 알게 됐습니다. 특히 그림자를 구운 뒤 !!그림자가 사라진!! 일로, 직접 쓴 셰이더는
        URP 가 해주던 것(Shadowmask)을 **내가 다 챙겨야 한다**는 걸 배웠습니다.
  improvements:
    - title: 커스텀 Render Feature
      body: >-
        이번엔 화면 전역에 적용하는 효과라 인스펙터에서 풀스크린 렌더러 피처에 머티리얼만 꽂으면 됐지만, 다음에는 Custom Render
        Feature 를 코드로 직접 구현해 렌더 패스 이해도를 높이겠습니다.
