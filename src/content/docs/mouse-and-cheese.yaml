# MouseAndCheese 기술 문서 — 신 파이프라인(코드→md→YAML)으로 조립.
#
# 자료(사람이 채운 3양식, src/assets/MouseAndCheese/):
#   ① 구현: 1-구현-MouseAndCheese.md   (대상 repo MouseAndCheeseGame 의 셰이더 · URP 설정 · C#)
#   ② 판단: 2-판단-직접.md · 이슈들.txt (결정 3건 · 회고 · 블렌더 임포트/그림자/GC 이슈 메모)
#   ③ 자산: 3-자산.md                  (스크린샷은 파일명으로 판단 · 깃허브 · 1인 · Github Desktop · Rider)
#
# ① 을 대상 저장소와 재대조했다(2026-09-25):
#   - ① 작성 후 커밋 7a30509 "셰이더 shadowmask 적용"이 들어와 ForwardPass 가 바뀌었다 → 현재 코드로 인용
#     (GetMainLight(shadowCoord, positionWS, shadowMask) · LIGHTMAP_ON / SHADOWS_SHADOWMASK 키워드 · TEXCOORD1 라이트맵 UV).
#   - 기간 끝은 마지막 커밋 2026-09-25 (① 의 09.24 보다 하루 뒤).
#   - ToonOutline_Mat 실제 값 _DepthThreshold 0.015 · _NormalThreshold 0.7 (① 은 셰이더 기본값 0.01/0.4).
#   - Cascade Split 60/90/120 of 150 = (0.4, 0.6, 0.8) — 스크린샷과 PC_RPAsset 일치.
#   - GC 수정은 커밋 5aca101 (TMP 텍스트를 Awake 에서 긴 문자열로 미리 채움).
# 수치: Shadow Casters 142 → 15 · Draw Calls 316 → 173 은 프로파일러 스크린샷 두 장에서 읽었다.
#   (② results 는 "20이하" 라 적었으나 결정 3 · 스크린샷은 15 — 스크린샷 값을 썼다.)
#   GC 는 수정 전 64.8KB/255회만 측정돼 있어 '후' 수치는 지어내지 않았다.
# hero: 사용자가 준 쥐 · 고양이 툰 셰이딩 캡처(hero.png).
# 블렌더는 사용자 요청대로 섹션 하나에 스크린샷 + 간단 설명만(모델링 · UV · 리깅 · IK · 애니메이션).
# 코드 하이라이터는 C# 전용이라 HLSL 도 C# 문법으로 칠해진다(C 계열이라 대체로 맞다).

subtitle: 3D 러너 — HLSL 툰 셰이더 · 화면공간 포스트프로세스 · 렌더링 최적화

# ── ① 개요 ─────────────────────────────────────────────────────────────────
overview:
  lead: >-
    쥐가 부엌을 달리며 고양이에게서 도망치는 **3D 러너**입니다. 캐릭터와 주방 소품은 **블렌더에서 직접 모델링 · UV · 리깅 ·
    애니메이션**까지 만들어 유니티로 가져왔고, 게임 분위기에 맞는 룩은 Shader Graph 없이 **HLSL 로 직접 작성한 URP 셰이더
    3종**으로 만들었습니다.
  what: >-
    오브젝트 단위의 **셀 셰이딩 + 림라이트**, 씬 전체에 한 번 도는 **화면공간 외곽선**, 이동 속도에 반응하는 **라디얼 블러**를
    다룹니다. 뒤의 둘은 C# 렌더 패스 없이 URP 내장 풀스크린 렌더러 피처에 머티리얼만 꽂아 돌립니다. 셰이더를 붙인 뒤 드러난
    **그림자 아티팩트 · 그림자 비용 · GC** 를 프로파일러로 추적해 잡은 과정도 함께 담았습니다.
  why: >-
    블렌더 Export → 유니티 Import 로 이어지는 **에셋 파이프라인을 직접 끝까지** 경험하고, HLSL 로 툰 셰이더와 렌더러 피처를
    작성하며 **셰이더가 URP 라이팅 · 그림자 · 깊이 버퍼와 어떻게 맞물리는지** 알고 싶었습니다.
  evidence: >-
    툰 셰이더를 붙이자 벽에 **계단 모양 그림자**가 생겼고(첫 Cascade 경계 ≈ 18유닛인데 주방은 카메라에서 20~50유닛),
    프로파일러에서 **Shadow Casters 142** · Draw Calls 316 이 잡혔으며, UI 텍스트가 한 프레임에 **GC 64.8KB(255회)** 를
    할당하고 있었습니다.
  stack:
    title: Shader Graph 없이 URP 라이팅을 직접 다루기 위한 선택
    rows:
      - category: 엔진 · 렌더링
        tech: Unity 6000.3.19f1 · URP 17.3.0 (Forward+)
        purpose: 커스텀 HLSL 셰이더를 URP 라이팅 · 그림자 · 렌더러 피처 체계에 맞춰 작성
      - category: 셰이더 언어
        tech: HLSL + ShaderLab
        purpose: 밴딩 임계값 · 림 · 그림자 감쇠 결합을 노드 대신 코드로 직접 제어
      - category: URP 셰이더 라이브러리
        tech: Core.hlsl · Lighting.hlsl · Blit.hlsl · DeclareDepthTexture · DeclareNormalsTexture
        purpose: 좌표 변환 · 메인 라이트 · 그림자 좌표 · 풀스크린 정점 · 깊이/노멀 샘플링을 표준 함수로 재사용 (Lit 원본 include · UsePass 미사용)
      - category: 풀스크린 패스
        tech: FullScreenPassRendererFeature ×2
        purpose: 외곽선 · 라디얼 블러를 C# 렌더 패스 작성 없이 머티리얼만으로 화면 전체에 적용
      - category: 그림자
        tech: Cascade 4 (0.4 / 0.6 / 0.8) · Mixed Light · Shadowmask
        purpose: 러너 카메라 이동 중 계단 그림자 제거 · 정적 오브젝트 그림자 베이크
      - category: 3D 에셋
        tech: Blender
        purpose: 캐릭터 · 주방 소품 모델링 · UV · 텍스처 · 리깅(IK) · 애니메이션
      - category: 셰이더 구동 C#
        tech: SpeedEffectController + ScriptableObject
        purpose: 이동 속도에 따라 블러 강도 · 카메라 FOV 를 SmoothDamp 로 조절

